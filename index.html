@'
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The One.Pixel — Atlas</title>
  <style>
    body { margin:0; background:#0a0a1a; overflow:hidden; }
    canvas { display:block; }
    #hud { position:fixed; top:16px; left:16px; color:#FF2200; font:14px monospace; }
    #hud span { color:#666; }
  </style>
</head>
<body>
<div id="hud">The One.Pixel — Atlas <span>· 20 VPs · 245 edges</span></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 10);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// --- Globe (red wireframe) ---
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(3, 32, 32),
  new THREE.MeshBasicMaterial({ color:0x330000, wireframe:true, transparent:true, opacity:0.3 })
);
scene.add(globe);

// --- VP Nodes (20 points on the sphere surface) ---
const vpColors = [
  0xFF2200, 0xFF4400, 0xFF6600, 0xFF2200, 0xFF4400,
  0xFF2200, 0xFF6600, 0xFF4400, 0xFF2200, 0xFF4400,
  0xFF6600, 0xFF2200, 0xFF4400, 0xFF2200, 0xFF6600,
  0xFF4400, 0xFF2200, 0xFF4400, 0xFF6600, 0xFF2200
];
const nodeGeom = new THREE.SphereGeometry(0.08, 8, 8);
const nodes = [];
for (let i = 0; i < 20; i++) {
  const phi = Math.acos(-1 + (2 * i) / 19);
  const theta = Math.sqrt(98 * Math.PI) * phi;
  const r = 3.0;
  const mat = new THREE.MeshBasicMaterial({ color: vpColors[i] });
  const node = new THREE.Mesh(nodeGeom, mat);
  node.position.set(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
  scene.add(node);
  nodes.push(node);
}

// --- Edges (245 connection lines) ---
const edgePositions = [];
for (let i = 0; i < 245; i++) {
  const a = nodes[Math.floor(Math.random() * 20)].position;
  const b = nodes[Math.floor(Math.random() * 20)].position;
  edgePositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
}
const edgeGeom = new THREE.BufferGeometry();
edgeGeom.setAttribute("position", new THREE.Float32BufferAttribute(edgePositions, 3));
const edges = new THREE.LineSegments(edgeGeom, new THREE.LineBasicMaterial({
  color: 0xFF2200, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending
}));
scene.add(edges);

// --- Drone (copper, patrolling) ---
const droneGeom = new THREE.ConeGeometry(0.15, 0.6, 8);
droneGeom.rotateX(Math.PI / 2);
const drone = new THREE.Mesh(droneGeom, new THREE.MeshBasicMaterial({ color: 0xB87333 }));
scene.add(drone);
const TRAIL = 60;
const tp = new Float32Array(TRAIL * 3);
const tGeom = new THREE.BufferGeometry();
tGeom.setAttribute("position", new THREE.BufferAttribute(tp, 3));
const trail = new THREE.Line(tGeom, new THREE.LineBasicMaterial({
  color: 0xB87333, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending
}));
scene.add(trail);
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-5, 2, 3),
  new THREE.Vector3(0, 4, -2),
  new THREE.Vector3(4, 1, 4),
  new THREE.Vector3(-2, 3, -3),
], true);

// --- Animate ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = (clock.getElapsedTime() * 0.15) % 1;
  drone.position.copy(curve.getPoint(t));
  drone.lookAt(curve.getPoint((t + 0.01) % 1));
  for (let i = (TRAIL-1)*3; i > 0; i--) tp[i] = tp[i-1];
  tp[0] = drone.position.x; tp[1] = drone.position.y; tp[2] = drone.position.z;
  tGeom.attributes.position.needsUpdate = true;
  globe.rotation.y += 0.001;
  edges.rotation.y += 0.001;
  nodes.forEach((n, i) => {
    n.position.applyAxisAngle(new THREE.Vector3(0,1,0), 0.001);
  });
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
