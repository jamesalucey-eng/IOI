<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The One.Pixel</title>
  <style>
    body { margin:0; background:#0a0a1a; overflow:hidden; }
    canvas { display:block; }
    #hud { position:fixed; top:16px; left:16px; color:#B87333; font:14px monospace; }
  </style>
</head>
<body>
<div id="hud">The One.Pixel — Arena</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(2, 32, 32),
  new THREE.MeshBasicMaterial({ color:0x00A86B, wireframe:true })
);
scene.add(globe);
const droneGeom = new THREE.ConeGeometry(0.2, 0.8, 8);
droneGeom.rotateX(Math.PI / 2);
const drone = new THREE.Mesh(droneGeom, new THREE.MeshBasicMaterial({ color:0xB87333 }));
scene.add(drone);
const TRAIL = 60;
const tp = new Float32Array(TRAIL * 3);
const tGeom = new THREE.BufferGeometry();
tGeom.setAttribute("position", new THREE.BufferAttribute(tp, 3));
const trail = new THREE.Line(tGeom, new THREE.LineBasicMaterial({
  color:0xB87333, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending
}));
scene.add(trail);
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-5, 2, 3),
  new THREE.Vector3(0, 4, -2),
  new THREE.Vector3(4, 1, 4),
  new THREE.Vector3(-2, 3, -3),
], true);
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = (clock.getElapsedTime() * 0.2) % 1;
  drone.position.copy(curve.getPoint(t));
  drone.lookAt(curve.getPoint((t + 0.01) % 1));
  for (let i = (TRAIL-1)*3; i > 0; i--) tp[i] = tp[i-1];
  tp[0] = drone.position.x; tp[1] = drone.position.y; tp[2] = drone.position.z;
  tGeom.attributes.position.needsUpdate = true;
  globe.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
